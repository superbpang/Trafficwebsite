<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>香港智慧城市地圖</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>香港智慧城市地圖</h1>
          <p>港鐵到站班次 · 運輸署交通快拍</p>
        </div>
        <form id="search-form" role="search">
          <label for="search">搜尋車站</label>
          <div class="search-row">
            <input id="search" name="station" list="station-list" placeholder="例如：金鐘、中環" autocomplete="off" disabled />
            <button type="submit" disabled>查看</button>
          </div>
          <datalist id="station-list"></datalist>
        </form>
      </header>
      <div id="map" role="application" aria-label="香港地圖"></div>
      <div id="legend"></div>
      <div id="zoom-hint"></div>
      <aside id="panel" aria-live="polite" hidden></aside>
      <p id="sources">
        到站班次：港鐵。交通快拍：運輸署。路軌和車站位置：OpenStreetMap。
        <span id="source-note"></span>
      </p>
    </div>
    <noscript>請啟用 JavaScript，才能顯示地圖、到站班次和交通快拍。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
